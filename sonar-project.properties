sonar.projectKey=omnicare-financial
sonar.projectName=OmniCare Financial
sonar.projectVersion=1.0

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/tests/**,**/node_modules/**,**/venv/**,.venv/**,**/dist/**,**/build/**
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/tests/**

sonar.qualitygate.wait=true
